[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:l2xpanel]
command=/opt/l2xpanel/.venv/bin/uvicorn app:app --host 0.0.0.0 --port %(ENV_PANEL_PORT)s --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/opt/l2xpanel
autorestart=true
stdout_logfile=/var/log/supervisor/l2xpanel.log
redirect_stderr=true
stdout_logfile_maxbytes=5MB

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray/config.json
autorestart=true
startretries=100
stdout_logfile=/var/log/supervisor/xray.log
redirect_stderr=true
stdout_logfile_maxbytes=5MB

[program:ipsec]
command=/usr/sbin/ipsec start --nofork
autorestart=true
stdout_logfile=/var/log/supervisor/ipsec.log
redirect_stderr=true
stdout_logfile_maxbytes=5MB

[program:xl2tpd]
command=/usr/sbin/xl2tpd -D -c /etc/xl2tpd/xl2tpd.conf
autorestart=true
stdout_logfile=/var/log/supervisor/xl2tpd.log
redirect_stderr=true
stdout_logfile_maxbytes=5MB

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
