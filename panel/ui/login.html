{% extends "base.html" %}
{% block title %}{{ t('Вход') }} · {{ app_name }}{% endblock %}
{% block head %}
<style>
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    background: radial-gradient(900px 500px at 15% 10%, rgba(34, 211, 238, .13), transparent 60%),
                radial-gradient(800px 500px at 90% 90%, rgba(129, 140, 248, .14), transparent 60%), var(--bg) }
  .auth-card { width: 100%; max-width: 380px; padding: 2rem 1.75rem }
  .auth-card .brand { justify-content: center; padding: 0 0 1.4rem; font-size: 1.25rem }
  .auth-card .brand .logo { width: 40px; height: 40px; font-size: 1rem }
  .err { background: var(--danger-soft); color: var(--danger); padding: .6rem .8rem; border-radius: 10px; font-size: .85rem; margin-bottom: .5rem }
</style>
{% endblock %}
{% block bare %}
<div class="auth">
  <form class="card auth-card" method="post" action="{{ bp }}/login" autocomplete="on">
    <div class="brand"><div class="logo">L2X</div>{{ app_name }}</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label class="f">{{ t('Логин') }}</label>
    <input name="username" autocomplete="username" required autofocus>
    <label class="f">{{ t('Пароль') }}</label>
    <input name="password" type="password" autocomplete="current-password" required>
    {% if totp_enabled %}
    <label class="f">{{ t('Код 2FA') }}</label>
    <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    {% endif %}
    <button class="btn mt" style="width:100%">{{ t('Вход') }}</button>
  </form>
</div>
{% endblock %}
