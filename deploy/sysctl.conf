# L2X Panel: forwarding, policy routing, and TCP performance for Xray + L2TP
net.ipv4.ip_forward = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.rp_filter = 2
# Headroom for nginx/Xray WS sockets (each session ≈ 2 FDs)
fs.file-max = 2097152

# --- throughput (high RTT / asymmetric upload) ---
# Install-time baseline (16 MB). Panel/tunnel binaries rewrite
# /etc/sysctl.d/99-l2xpanel-perf.conf with RAM-sized buffers on start.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.ip_local_reserved_ports = 11080,11081,18080,19100
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
-net.netfilter.nf_conntrack_max = 262144
