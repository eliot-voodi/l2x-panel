# managed by l2x-panel
# The panel is published on plain HTTP :80 so it works on a bare IP.
# Port 443 is usually taken by an Xray inbound (VLESS Reality), so HTTPS for
# subscriptions is served by the panel itself (Settings → Subscriptions → dedicated server)
# with a Let's Encrypt certificate issued from Settings → Certificates (domain or IP).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # backup restore uploads
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # acme.sh webroot: certificates are issued and renewed without stopping nginx
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/l2x-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # overwrite, never append: the panel trusts the first X-Forwarded-For entry for login rate limiting
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Xray install, geo update and speedtest can take a while
        proxy_read_timeout 300s;
    }
}
