# managed by l2x-panel
# Port 80: ACME challenges + redirect everything else to HTTPS.
# Public :443 (panel, subscriptions, inbounds) is generated by the panel in /etc/nginx/l2x/.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/l2x-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
