# Managed by L2X Panel — Pi-hole for DoH upstream (host UDP/TCP 5353 → container 53)
# Port 53 on the host is reserved for MasterDNS (l2x-dnsd).
# Install from panel: DoH / Pi-hole → «Установить Pi-hole»
services:
  pihole:
    image: pihole/pihole:latest
    container_name: l2x-pihole
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: ALL
    ports:
      - "127.0.0.1:5353:53/tcp"
      - "127.0.0.1:5353:53/udp"
      - "127.0.0.1:8089:80/tcp"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
