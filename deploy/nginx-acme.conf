# managed by l2x-panel
# Direct mode: the panel has its own port, nginx on :80 only answers Let's Encrypt challenges.
# Public :443 for inbounds is generated by the panel in /etc/nginx/l2x/.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/l2x-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
